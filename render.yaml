version: "1"

services:
  - type: web
    name: summa-front
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_DIRECT_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
